<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="An interactive WebGL preview of a book-fold handset, built with TypeScript and three.js." />
    <meta name="color-scheme" content="light" />
    <title>iPhone Duo - Animation</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/favicon.ico" />
    <link rel="preload" href="/assets/iPhone_Duo_Render.usdc" as="fetch" crossorigin />
    <link rel="preload" href="/assets/ui/base.jpg" as="image" />
    <link rel="preload" href="/assets/ui/top.png" as="image" />
    <link rel="preload" href="/assets/ui/middle.png" as="image" />
    <link rel="preload" href="/assets/ui/clock-inner.avif" as="image" />
    <link rel="preload" href="/assets/ui/clock-outer.avif" as="image" />
  </head>
  <body>
    <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
    <nav class="site-links" aria-label="Project links">
      <a
        class="site-link"
        href="https://github.com/akashtdev/iphone-duo-animation"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="View source on GitHub"
        title="GitHub"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.071 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.833.092-.647.35-1.088.636-1.339-2.221-.253-4.556-1.113-4.556-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.269 2.75 1.026A9.564 9.564 0 0 1 12 6.844c.85.004 1.705.115 2.504.337 1.909-1.295 2.747-1.026 2.747-1.026.546 1.378.203 2.397.1 2.65.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.749 0 .268.18.58.688.482A10.02 10.02 0 0 0 22 12.017C22 6.484 17.522 2 12 2Z"
          />
        </svg>
      </a>
      <a
        class="site-link"
        href="https://x.com/akashtdev"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Follow on X"
        title="X (Twitter)"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231ZM17.083 19.77h1.833L7.004 4.126H5.036Z"
          />
        </svg>
      </a>
    </nav>
    <main class="page">
      <div class="page-header">
        <h1 class="page-title">Take a closer look.</h1>
        <div class="upload-row">
          <button
            type="button"
            id="reset-upload"
            class="reset-button"
            aria-label="Reset to default image"
            title="Reset to default image"
            hidden
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3" />
              <path d="M4.5 4.5v4h4" />
            </svg>
          </button>
          <button type="button" id="upload" class="upload-button" disabled>Upload custom image</button>
        </div>
      </div>

      <section class="viewer" aria-label="Foldable design">
        <div
          id="stage"
          class="stage"
          role="img"
          aria-label="3D model of the device. Drag to rotate and scroll to zoom."
        ></div>

        <div class="highlights" id="highlights">
          <div class="highlight-steps">
            <button type="button" id="previous-highlight" class="step-button" aria-label="Previous highlight">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6.5 14.5 5.5-5.5 5.5 5.5" /></svg>
            </button>
            <button type="button" id="next-highlight" class="step-button" aria-label="Next highlight">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6.5 9.5 5.5 5.5 5.5-5.5" /></svg>
            </button>
          </div>
          <ul class="highlight-list" id="highlight-list"></ul>
        </div>


        <input id="upload-file" type="file" accept="image/*" hidden />
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
