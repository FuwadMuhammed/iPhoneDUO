<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Generate realistic iPhone Duo mockups from your own app screenshots — export as PNG, JPEG, WebM or MP4."
    />
    <meta
      name="keywords"
      content="iPhone Duo mockup, iPhone Duo mockup generator, foldable iPhone mockup, iPhone Duo generator, device mockup tool, app screenshot mockup generator, foldable phone mockup, iPhone Duo 3D render, product mockup export, mockup PNG JPEG WebM MP4"
    />
    <meta name="author" content="Fuwad Muhammed" />
    <meta name="robots" content="index, follow" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f9fafb" />
    <link rel="canonical" href="https://your-domain.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="iPhone Duo Mockup Generator" />
    <meta
      property="og:description"
      content="Generate realistic iPhone Duo mockups from your own app screenshots — export as PNG, JPEG, WebM or MP4."
    />
    <meta property="og:url" content="https://your-domain.com/" />
    <meta property="og:image" content="/favicon.ico" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="iPhone Duo Mockup Generator" />
    <meta
      name="twitter:description"
      content="Generate realistic iPhone Duo mockups from your own app screenshots — export as PNG, JPEG, WebM or MP4."
    />
    <meta name="twitter:image" content="/favicon.ico" />

    <title>iPhone Duo Mockup Generator</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/favicon.ico" />
    <!-- Start the largest download early, at low priority so it never holds up the page, styles or menu. -->
    <link rel="preload" href="/assets/iPhone_Duo_Render.usdc" as="fetch" crossorigin fetchpriority="low" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "iPhone Duo Mockup Generator",
        "applicationCategory": "DesignApplication",
        "operatingSystem": "Web",
        "description": "Generate realistic iPhone Duo mockups from your own app screenshots — export as PNG, JPEG, WebM or MP4.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
  </head>
  <body>
    <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
    <main class="page">
      <div class="page-header">
        <h1 class="page-title">iPhone Duo Mockup Generator</h1>
      </div>

      <section class="viewer" aria-label="iPhone Duo mockup preview">
        <div
          id="stage"
          class="stage"
          role="img"
          aria-label="3D model of the device. Drag to rotate and scroll to zoom."
        ></div>

        <div
          id="loader"
          class="loader"
          role="progressbar"
          aria-label="Loading 3D model"
          aria-busy="true"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
        >
          <span class="loader-spinner" aria-hidden="true"></span>
          <span class="loader-label">Loading 3D model</span>
          <span class="loader-track" aria-hidden="true"><span class="loader-bar"></span></span>
        </div>

        <div class="highlights" id="highlights">
          <div class="highlight-sheet is-collapsed" id="highlight-sheet" aria-live="polite"></div>
          <ul class="highlight-list" id="highlight-list"></ul>
        </div>

        <div class="toolbar">
          <button type="button" id="open-upload" class="toolbar-button" aria-haspopup="dialog">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V5M7.5 9.5 12 5l4.5 4.5" /><path d="M4.5 19h15" /></svg>
            <span>Upload</span>
          </button>
          <button type="button" id="open-export" class="toolbar-button toolbar-button--primary" aria-haspopup="dialog">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v10M7.5 10.5 12 15l4.5-4.5" /><path d="M4.5 19h15" /></svg>
            <span>Export</span>
          </button>
        </div>

      </section>
    </main>

    <div class="modal-backdrop" id="upload-modal" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="upload-modal-title">
        <div class="modal-head">
          <h2 id="upload-modal-title">Upload images</h2>
          <button type="button" class="modal-close" data-close-modal aria-label="Close">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
          </button>
        </div>
        <div class="modal-body">
          <p class="modal-intro">One image per state — each is fitted to that state's exact screen.</p>
          <div class="upload-list" id="upload-list"></div>
        </div>
        <div class="modal-foot">
          <button type="button" id="reset-all-uploads" class="modal-secondary">Reset all</button>
        </div>
      </div>
    </div>

    <div class="modal-backdrop" id="export-modal" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="export-modal-title">
        <div class="modal-head">
          <h2 id="export-modal-title">Export</h2>
          <button type="button" class="modal-close" data-close-modal aria-label="Close">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
          </button>
        </div>
        <div class="modal-body" id="mockup-export"></div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
    <script type="module" src="/src/mockup/bootstrap.ts"></script>
    <script
      data-name="BMC-Widget"
      data-cfasync="false"
      src="https://cdnjs.buymeacoffee.com/1.0.0/widget.prod.min.js"
      data-id="fuwad"
      data-description="Support me on Buy me a coffee!"
      data-message=""
      data-color="#5F7FFF"
      data-position="Right"
      data-x_margin="18"
      data-y_margin="18"
    ></script>
  </body>
</html>
